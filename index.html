<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stay Curious • Adventure Journal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    @property --gradient-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    :root {
      --bg: #080b12;
      --bg-elevated: #0d1117;
      --bg-card: #111820;
      --bg-card-hover: #161f2c;
      --text: #e8edf5;
      --text-muted: #7a8ba8;
      --text-dim: #4a5568;
      --accent: #c8a46e;
      --accent-bright: #e4c78f;
      --accent-dim: #8a7044;
      --red: #c0392b;
      --border: rgba(200,164,110,0.08);
      --border-hover: rgba(200,164,110,0.2);
      --radius: 4px;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Sora', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::selection { background: var(--accent); color: var(--bg); }

    html {
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-dim) var(--bg);
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.7;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      cursor: none;
    }

    /* ─── CUSTOM CURSOR ─── */
    .cursor {
      position: fixed; top: 0; left: 0; z-index: 99999;
      pointer-events: none; mix-blend-mode: difference;
      transition: transform 0.15s var(--ease-out-expo);
    }
    .cursor-dot {
      width: 8px; height: 8px; background: #fff;
      border-radius: 50%; transform: translate(-50%, -50%);
    }
    .cursor-ring {
      width: 40px; height: 40px; border: 1.5px solid rgba(255,255,255,0.5);
      border-radius: 50%; transform: translate(-50%, -50%);
      transition: width 0.3s var(--ease-out-expo), height 0.3s var(--ease-out-expo),
                  border-color 0.3s ease;
    }
    .cursor.hovering .cursor-ring {
      width: 60px; height: 60px; border-color: var(--accent);
    }

    @media (pointer: coarse) {
      body { cursor: auto; }
      .cursor { display: none; }
    }

    /* ─── GRAIN OVERLAY ─── */
    .grain {
      position: fixed; inset: 0; z-index: 9998; pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px;
    }

    /* ─── SCROLL PROGRESS BAR ─── */
    .scroll-progress {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      z-index: 10001; background: transparent;
      transform-origin: left;
    }
    .scroll-progress-bar {
      height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent), var(--accent-bright));
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.1s linear;
    }

    /* ─── HEADER ─── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
      padding: 1.8rem 6%;
      background: transparent;
      transition: all 0.6s var(--ease-out-expo);
    }
    header.scrolled {
      padding: 1rem 6%;
      background: rgba(8, 11, 18, 0.85);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border-bottom: 1px solid var(--border);
    }

    nav {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 1400px; margin: 0 auto;
    }

    .logo {
      font-family: var(--font-display); font-size: 1.6rem; font-weight: 900;
      letter-spacing: -0.5px; text-decoration: none; cursor: none;
      color: var(--accent); position: relative;
      transition: color 0.3s ease;
    }
    .logo:hover { color: var(--accent-bright); }
    .logo span { font-weight: 400; font-style: italic; color: var(--text-muted); font-size: 0.85em; margin-left: 0.3em; }

    .nav-links { display: flex; gap: 2.8rem; align-items: center; }
    .nav-links a {
      font-family: var(--font-mono); font-size: 0.75rem; font-weight: 500;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted); text-decoration: none;
      cursor: none; position: relative; padding: 0.3rem 0;
      transition: color 0.3s ease;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .nav-links a::before {
      content: ''; position: absolute; bottom: -2px; left: 0;
      width: 0; height: 1px; background: var(--accent);
      transition: width 0.4s var(--ease-out-expo);
    }
    .nav-links a:hover::before, .nav-links a.active::before { width: 100%; }

    /* ─── PAGE TRANSITION ─── */
    .page-transition {
      position: fixed; inset: 0; z-index: 99997;
      background: var(--bg); pointer-events: none;
      transform: scaleY(0); transform-origin: bottom;
    }
    .page-transition.active {
      animation: pageWipe 0.8s var(--ease-out-expo) forwards;
    }
    @keyframes pageWipe {
      0% { transform: scaleY(0); transform-origin: bottom; }
      45% { transform: scaleY(1); transform-origin: bottom; }
      46% { transform-origin: top; }
      100% { transform: scaleY(0); transform-origin: top; }
    }

    /* ─── MAIN ─── */
    main { max-width: 100%; margin: 0 auto; padding: 0; min-height: 80vh; }

    /* ─── HERO ─── */
    .hero {
      position: relative; min-height: 100dvh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 0 6%;
      overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(200,164,110,0.04) 0%, transparent 70%);
    }
    .hero-badge {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 4px;
      text-transform: uppercase; color: var(--accent);
      border: 1px solid var(--border-hover); padding: 0.5rem 1.5rem;
      border-radius: 100px; margin-bottom: 3rem;
      opacity: 0; transform: translateY(20px);
      animation: revealUp 1s var(--ease-out-expo) 0.2s forwards;
    }
    .hero h1 {
      font-family: var(--font-display); font-weight: 900;
      font-size: clamp(3.5rem, 9vw, 8rem); line-height: 0.95;
      letter-spacing: -3px; color: var(--text);
      text-wrap: balance; max-width: 900px;
      opacity: 0; transform: translateY(40px);
      animation: revealUp 1.2s var(--ease-out-expo) 0.4s forwards;
    }
    .hero h1 em {
      font-style: italic; color: var(--accent);
      background: linear-gradient(135deg, var(--accent), var(--accent-bright));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-sub {
      font-size: clamp(1rem, 2vw, 1.25rem); color: var(--text-muted);
      max-width: 520px; margin-top: 2rem; font-weight: 300;
      opacity: 0; transform: translateY(30px);
      animation: revealUp 1s var(--ease-out-expo) 0.7s forwards;
    }
    .hero-line {
      width: 1px; height: 80px; background: linear-gradient(to bottom, var(--accent), transparent);
      margin-top: 4rem;
      opacity: 0; animation: revealUp 1s var(--ease-out-expo) 1s forwards;
    }
    .hero-scroll-hint {
      position: absolute; bottom: 3rem; left: 50%; transform: translateX(-50%);
      font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 3px;
      text-transform: uppercase; color: var(--text-dim);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(8px); } }

    /* ─── ARTICLES SECTION ─── */
    .articles-section {
      max-width: 1400px; margin: 0 auto; padding: 8rem 6% 6rem;
    }
    .section-label {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 4px;
      text-transform: uppercase; color: var(--accent-dim); margin-bottom: 1rem;
    }
    .section-title {
      font-family: var(--font-display); font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700; letter-spacing: -1px; margin-bottom: 4rem;
      color: var(--text);
    }
    .section-title span { color: var(--text-dim); font-weight: 400; }

    /* ─── ARTICLE CARDS — EDITORIAL GRID ─── */
    .articles-grid {
      display: grid; gap: 2rem;
      grid-template-columns: repeat(2, 1fr);
    }

    .article-card {
      position: relative; overflow: hidden;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-card);
      cursor: none;
      transition: all 0.5s var(--ease-out-expo);
      opacity: 0; transform: translateY(60px);
    }
    .article-card.visible {
      opacity: 1; transform: translateY(0);
    }
    .article-card:hover {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
      transform: translateY(-4px);
      box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px var(--border-hover);
    }

    /* Feature card — first post spans full width */
    .article-card.featured {
      grid-column: 1 / -1;
      display: grid; grid-template-columns: 1.2fr 1fr;
      min-height: 500px;
    }
    .article-card.featured .card-image { height: 100%; }
    .article-card.featured .card-body { display: flex; flex-direction: column; justify-content: center; }
    .article-card.featured h2 { font-size: clamp(1.8rem, 3vw, 2.8rem); }

    .card-image {
      position: relative; height: 300px; overflow: hidden;
    }
    .card-image img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.8s var(--ease-out-expo), filter 0.8s ease;
      filter: saturate(0.8);
    }
    .article-card:hover .card-image img {
      transform: scale(1.05); filter: saturate(1);
    }
    .card-image::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, var(--bg-card) 0%, transparent 50%);
      pointer-events: none;
    }
    .article-card.featured .card-image::after {
      background: linear-gradient(to right, transparent 60%, var(--bg-card) 100%);
    }

    .card-body { padding: 2rem 2.2rem 2.5rem; position: relative; }

    .card-category {
      font-family: var(--font-mono); font-size: 0.65rem; font-weight: 500;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--accent); margin-bottom: 1rem;
      display: flex; align-items: center; gap: 0.8rem;
    }
    .card-category::before {
      content: ''; width: 16px; height: 1px; background: var(--accent);
    }

    .card-body h2 {
      font-family: var(--font-display); font-size: clamp(1.4rem, 2.5vw, 1.9rem);
      font-weight: 700; line-height: 1.2; letter-spacing: -0.5px;
      color: #fff; margin-bottom: 1rem;
      transition: color 0.3s ease;
    }
    .article-card:hover .card-body h2 { color: var(--accent-bright); }

    .card-summary {
      font-size: 0.92rem; color: var(--text-muted); line-height: 1.65;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex; align-items: center; gap: 1.5rem;
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 1px;
      color: var(--text-dim); margin-top: 1.5rem; padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    .card-meta span { display: flex; align-items: center; gap: 0.4rem; }

    .read-indicator {
      position: absolute; bottom: 2.5rem; right: 2.2rem;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      transition: all 0.4s var(--ease-out-expo);
      color: var(--text-dim);
    }
    .article-card:hover .read-indicator {
      background: var(--accent); border-color: var(--accent); color: var(--bg);
      transform: rotate(-45deg);
    }

    /* ─── CURRENT READS ─── */
    .reads-view { animation: fadeSlideIn 0.6s var(--ease-out-expo); }

    .reads-hero {
      min-height: 62vh; display: flex; flex-direction: column; justify-content: flex-end;
      max-width: 1400px; margin: 0 auto; padding: 10rem 6% 6rem;
      border-bottom: 1px solid var(--border);
    }
    .reads-kicker {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 4px;
      text-transform: uppercase; color: var(--accent); margin-bottom: 1.5rem;
    }
    .reads-hero h1 {
      font-family: var(--font-display); font-size: clamp(3.5rem, 9vw, 7.5rem);
      font-weight: 900; line-height: 0.9; letter-spacing: -4px;
      color: #fff; margin-bottom: 2rem;
    }
    .reads-hero h1 em { color: var(--accent); font-weight: 400; }
    .reads-intro {
      max-width: 650px; color: var(--text-muted); font-size: 1rem;
      font-weight: 300; line-height: 1.8;
    }

    .reads-section { max-width: 1200px; margin: 0 auto; padding: 7rem 6% 8rem; }
    .reads-count {
      font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 3px;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 2rem;
    }

    .featured-read {
      display: grid; grid-template-columns: 80px 1fr auto; gap: 2rem;
      align-items: end; padding: 3rem; margin-bottom: 5rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(200,164,110,0.1), var(--bg-card) 55%);
      opacity: 0; transform: translateY(40px);
      transition: all 0.6s var(--ease-out-expo);
    }
    .featured-read.visible { opacity: 1; transform: translateY(0); }
    .book-number {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 2px;
      color: var(--accent-dim); padding-top: 0.3rem;
    }
    .featured-read .book-number { font-size: 1rem; }
    .book-title {
      font-family: var(--font-display); font-size: 1.45rem; font-weight: 700;
      line-height: 1.25; letter-spacing: -0.25px; color: #fff;
    }
    .featured-read .book-title {
      font-size: clamp(2rem, 4vw, 3.6rem); letter-spacing: -1.5px;
    }
    .book-author {
      font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text-dim); margin-top: 0.7rem;
    }
    .book-note {
      font-family: var(--font-display); font-size: 0.9rem; font-style: italic;
      color: var(--accent-bright); margin-top: 0.8rem;
    }
    .featured-note {
      font-family: var(--font-mono); font-size: 0.65rem; line-height: 1.6;
      letter-spacing: 2px; text-transform: uppercase; color: var(--accent);
      text-align: right; max-width: 170px;
    }

    .reading-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      border-top: 1px solid var(--border);
    }
    .book-card {
      display: grid; grid-template-columns: 44px 1fr; gap: 1rem;
      padding: 2.2rem 0; border-bottom: 1px solid var(--border);
      opacity: 0; transform: translateY(35px);
      transition: opacity 0.55s var(--ease-out-expo), transform 0.55s var(--ease-out-expo), background 0.3s ease;
    }
    .book-card.visible { opacity: 1; transform: translateY(0); }
    .book-card:nth-child(odd) { padding-right: 2.5rem; border-right: 1px solid var(--border); }
    .book-card:nth-child(even) { padding-left: 2.5rem; }
    .book-card:hover { background: rgba(255,255,255,0.015); }

    /* ─── SINGLE POST VIEW ─── */
    .single-post-view { animation: fadeSlideIn 0.6s var(--ease-out-expo); }

    .post-hero {
      position: relative; height: 75vh; min-height: 500px;
      overflow: hidden; display: flex; align-items: flex-end;
    }
    .post-hero-img {
      position: absolute; inset: 0;
    }
    .post-hero-img img {
      width: 100%; height: 100%; object-fit: cover;
      filter: saturate(0.7);
    }
    .post-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, var(--bg) 0%, rgba(8,11,18,0.3) 40%, transparent 70%);
    }
    .post-hero-content {
      position: relative; z-index: 2; padding: 0 6% 5rem;
      max-width: 900px;
    }
    .post-hero-content .card-category { margin-bottom: 1.5rem; }
    .post-hero-content h1 {
      font-family: var(--font-display); font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900; line-height: 1; letter-spacing: -2px;
      color: #fff; margin-bottom: 1.5rem; text-wrap: balance;
    }
    .post-hero-meta {
      display: flex; gap: 2rem; align-items: center;
      font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 1.5px;
      color: var(--text-muted);
    }
    .post-hero-meta .divider { color: var(--accent-dim); }

    .back-btn {
      position: fixed; top: 5.5rem; left: 6%; z-index: 9999;
      display: inline-flex; align-items: center; gap: 0.6rem;
      font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text-muted);
      text-decoration: none; cursor: none; padding: 0.6rem 1.2rem;
      background: rgba(8,11,18,0.7); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 100px;
      transition: all 0.3s var(--ease-out-expo);
    }
    .back-btn:hover { color: var(--accent); border-color: var(--border-hover); transform: translateX(-4px); }

    /* Post Body */
    .post-body-wrap {
      max-width: 760px; margin: 0 auto; padding: 5rem 6% 6rem;
    }
    .post-body { font-size: 1.1rem; color: #bfc9db; font-weight: 300; }
    .post-body p { margin-bottom: 1.8rem; }
    .post-body strong { color: var(--text); font-weight: 600; }
    .post-body h3 {
      font-family: var(--font-display); color: #fff; font-size: 2rem;
      font-weight: 700; margin: 4rem 0 1.5rem; letter-spacing: -0.5px;
      padding-top: 3rem; border-top: 1px solid var(--border);
      position: relative;
    }
    .post-body h3::before {
      content: ''; position: absolute; top: -1px; left: 0;
      width: 40px; height: 1px; background: var(--accent);
    }
    .post-body h4 {
      font-family: var(--font-display); color: var(--accent);
      font-size: 1.4rem; margin: 2.5rem 0 0.8rem;
    }
    .post-body ul { margin-bottom: 1.8rem; padding-left: 1.5rem; }
    .post-body li { margin-bottom: 0.6rem; color: #bfc9db; }
    .post-body li strong { color: var(--accent-bright); }

    .post-body img {
      width: calc(100% + 8rem); max-width: 100vw;
      margin: 3rem -4rem; border-radius: var(--radius);
      box-shadow: 0 20px 60px -15px rgba(0,0,0,0.6);
      transition: transform 0.6s var(--ease-out-expo);
    }
    @media (max-width: 900px) {
      .post-body img { width: 100%; margin: 2.5rem 0; }
    }
    .post-body .image-caption {
      text-align: center; color: var(--text-dim); font-size: 0.82rem;
      font-style: italic; margin-top: -2.2rem; margin-bottom: 2rem;
      font-family: var(--font-display);
    }

    .post-end {
      max-width: 760px; margin: 0 auto; padding: 0 6% 6rem;
      border-top: 1px solid var(--border); padding-top: 3rem;
    }
    .post-end-btn {
      display: inline-flex; align-items: center; gap: 0.6rem;
      font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 2px;
      text-transform: uppercase; color: var(--accent);
      text-decoration: none; cursor: none; padding: 0.8rem 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    .post-end-btn:hover { border-color: var(--accent); transform: translateX(-6px); }

    /* ─── FOOTER ─── */
    footer {
      text-align: center; padding: 6rem 6% 8rem;
      border-top: 1px solid var(--border);
    }
    .footer-logo {
      font-family: var(--font-display); font-size: 1.4rem; font-weight: 900;
      color: var(--accent-dim); margin-bottom: 1rem;
    }
    .footer-text {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 2px;
      text-transform: uppercase; color: var(--text-dim);
    }

    /* ─── ANIMATIONS ─── */
    @keyframes revealUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 900px) {
      .articles-grid { grid-template-columns: 1fr; }
      .article-card.featured { grid-template-columns: 1fr; }
      .article-card.featured .card-image { height: 300px; }
      .article-card.featured .card-image::after {
        background: linear-gradient(to top, var(--bg-card) 0%, transparent 50%);
      }

      content: `
        <p>There's a specific smell in the Pacific Northwest when the season turns. It's the smell of wet decay, heavy moss, and cold rain hitting the dirt. We headed into the Dark Divide on October 25th, aiming for <strong>Snagtooth Falls</strong>—a hidden gem that doesn't give itself up easily.</p>
        <p>The forecast was "wet," which usually means "soaked." But we had the itch to get out, so we packed the truck and headed for the Lewis River.</p>
        <h3>Camp: The Wet Tarp Symphony</h3>
        <p>We arrived at the horse camp right next to the Lewis River/Quartz Creek Trailhead in the late afternoon. The camp was empty—smart people were likely at home. The rain was already coming down in steady sheets, turning the dirt loops into a mud slick.</p>
        <p>We set up quickly. No hot tent luxury this time; just a tarp setup rigged high to keep the rain off the "kitchen." There's a distinct art to cooking a good meal while water pools around your boots. We threw some steaks on the cast iron, fighting the damp air to keep the heat up. Eating a ribeye while listening to the Lewis River roar in the darkness, with rain hammering the tarp above, is a mood you can't buy.</p>
        <img src="images/rainy_camp_placeholder.jpg" alt="Rainy camp setup at Lewis River Horse Camp" style="width: 100%; height: auto; border-radius: 12px;">
        <p class="image-caption">Base camp in the rain. Tarpology 101.</p>
        <h3>The Bushwhack</h3>
        <p>Morning brought gray light and more rain. We geared up—Gore-Tex everything—and looked at the map. Snagtooth Falls isn't on a marked trail. It sits up a drainage that requires a bit of navigation and a lot of patience.</p>
        <p>We started the bushwhack up Snagtooth Creek. The plan was to follow the creek line straight to the waterfalls. On the map (below), it looked like a straightforward red line. In reality, it was a jungle gym of wet slide alder, devil's club, and slippery deadfall.</p>
        <img src="images/snagtooth_map.jpg" alt="Map of our route to Snagtooth Falls" style="width: 100%; height: auto; border-radius: 12px;">
        <p class="image-caption">The plan vs. the terrain. The red line marks our push up the creek.</p>
        <p>We moved slow. Every step was a calculation to avoid sliding back down the ravine. The woods were incredibly quiet, muffled by the soaking wet moss. It felt ancient and untouched, the kind of forest that swallows sound.</p>
        <h3>The Lower Falls</h3>
        <p>After a few hours of battling the brush, we heard it. The low rumble of water crashing down rock. We pushed through a final thicket and came out at the base of <strong>Lower Snagtooth Falls</strong>.</p>
        <p>Because of the heavy rains, the falls were raging. It wasn't a delicate trickle; it was a firehose of white water cutting through the black basalt. It was beautiful, violent, and loud.</p>
        <img src="images/lower_snagtooth_falls.jpg" alt="The raging Lower Snagtooth Falls" style="width: 100%; height: auto; border-radius: 12px;">
        <p class="image-caption">Lower Snagtooth Falls in full flow.</p>
        <h3>The Turnaround</h3>
        <p>We stood there for a long time, soaking it in (literally and figuratively). We looked up at the route to the Upper Falls. It involved a steep, muddy scramble that, in dry conditions, would be a fun challenge. Today, it was a slick mudslide waiting to happen.</p>
        <p>We made the call. "The mountain will be there," as they say. We had reached the Lower Falls, seen the power of the creek, and had a hell of a time getting there. Pushing higher felt like asking for trouble.</p>
        <p>We hiked back out, retracing our muddy steps to the truck. We were wet, cold, and covered in pine needles, but that's exactly what we signed up for.</p>
      `

      content: `
        <p>There is nothing quite like the contrast of a freezing cold ridge and a wood-burning stove glowing inside a tent. For this trip, we headed to <strong>Silver Star Mountain</strong> in Washington. At 3,490 feet, it's not the tallest peak, but it offers some of the most expansive views in the area.</p>
        <h3>The Crew & The Climb</h3>
        <p>I headed out with the usual suspects: my girlfriend Kelsey, our friend Luke, and his wife Helen. We started at the Silver Star Trailhead on a crisp, partly cloudy day. The air had that sharp winter bite that lets you know you're in the mountains.</p>
        <img src="images/image4.jpg" alt="Hiking up Silver Star" style="width: 100%; height: auto; border-radius: 12px;">
        <p class="image-caption">Hiking up toward the ridge.</p>
        <p>The hike in is about two miles to where we planned to camp. We wanted privacy, so we pushed off-trail to find a spot away from any other hikers. We found a perfect patch of snow to pitch the tent, ensuring we had a flat base for the night.</p>
        <h3>The Hot Tent Setup</h3>
        <p>The star of the show (besides the mountain) was the gear. I brought my <strong>Lite Outdoors Plateau 5 Ultralight</strong> tent paired with their large titanium stove. It's technically a 5-person tent, which meant plenty of room for the four of us and gear.</p>
        <p>Once base camp was set, we dropped our heavy packs and hiked the rest of the way to the summit. The views were incredible—we could see for miles.</p>
        <img src="images/image3.jpg" alt="Group photo on the rocky summit" style="width: 100%; height: auto; border-radius: 12px;">
        <p class="image-caption">The crew at the top: Helen, Luke, Kelsey, and me.</p>
        <h3>Burgers & Biscuits</h3>
        <p>We hiked back down to camp as the sun began to dip. This is when the hot tent changes the game. Instead of shivering in sleeping bags, we fired up the titanium stove. We cooked burgers right there on the stove for dinner, staying warm while the temperature outside plummeted.</p>
        <img src="images/image2.jpg" alt="Cooking on the titanium stove inside the tent" style="width: 100%; height: auto; border-radius: 12px;">
        <p class="image-caption">Burgers on the Lite Outdoors titanium stove.</p>
        <p>The next morning, we kept the luxury going with biscuits and gravy before packing up. It was a short trip—just one night—but exactly what we needed.</p>
        <img src="images/image6.jpeg" alt="Silhouette on the ridge" style="width: 100%; height: auto; border-radius: 12px;">

    {
      id: 1, 
      title: "The 3,000-Mile Loop: Red Rocks, Big Trees, and the Tesla Hotel",
      category: "Trips",
      date: "October 14, 2025",
      readTime: "45 min read",
      image: "images/image_2.png", 
      summary: "12 days from Oregon to the Grand Canyon and back. Two nights backpacking Sheiks Canyon, sleeping in a Tesla, and proving you don't need campgrounds to see the West.",
      content: `
        <p>There is a specific kind of freedom that comes from leaving your driveway in Banks, Oregon, knowing you have no reservations. No hotels booked, no campsites reserved. Just us, the Tesla, and 3,000 miles of open road ahead. The plan was simple: head south until the dirt turned red, stay out as long as we could, and never pay to sleep.</p>
        <p>The first leg was a blur of asphalt. We pushed hard through the desolate stretches of Idaho and the busy corridor of Salt Lake City. The goal was to reach the Utah border before stopping. We weren't interested in cities; we were chasing that specific silence you only find in the high desert.</p>
        <h3>The Setup: The "Tesla Hotel"</h3>
        <p>The most common question we get is, "How do you camp in an EV?" The answer is: surprisingly luxuriously. People think EV road trips are restrictive, bound by charging stations and range anxiety. But once you leave the interstate, the car becomes a self-contained pod.</p>
        <p>We turned the back of the Model Y into a permanent bedroom. We folded the seats down and installed a fitted air mattress that stayed inflated for the entire 12 days. The real game-changer, however, is "Camp Mode." It maintains climate control, airflow, and white noise all night with minimal battery drain. We slept comfortably in freezing high-desert nights and 90-degree heat without ever idling an engine.</p>
        <img src="images/image_1.png" alt="Morning coffee while dispersed camping next to the Tesla" style="width: 100%; height: auto; border-radius: 12px;">
        <p class="image-caption">Morning routine: Coffee on BLM land, zero fees.</p>
        <p>The rule of the trip was strict: <strong>Dispersed camping only.</strong> We relied entirely on public lands—finding hidden pull-offs down long dirt roads far from the RV parks and generator noise. There is something magical about waking up, opening the trunk, and seeing nothing but sagebrush and sandstone for miles.</p>
        <h3>Part 1: The Red Rock Initiation</h3>
        <p>We hit the "Mighty 5" area with force. Canyonlands and Arches are spectacular, but they are also crowded. We spent our days navigating the paved viewpoints with the masses. Canyonlands makes you feel incredibly small; the sheer scale of the drop-offs is hard to comprehend until you are standing right on the edge.</p>
        <img src="images/image_4.png" alt="Standing on the edge of a cliff in Canyonlands" style="width: 100%; height: auto; border-radius: 12px;">
        <p>We found ways to make it our own, scrambling on the slickrock near Moab and finding quiet corners to mess around. Even in the most popular parks, if you walk a mile away from the parking lot, the crowds disappear.</p>
        <img src="images/image_3.png" alt="Handstands under an arch formation" style="width: 100%; height: auto; border-radius: 12px;">
        <p>But the crowds in the National Parks were eventually wearing on us. We didn't come all this way to stand in line for a photo. We needed silence. We needed to get away from the pavement.</p>
        <h3>Part 2: The Deep Backcountry</h3>
        <p>We drove south towards Bears Ears National Monument. The goal was the <strong>Sheiks Canyon to Bullet Canyon loop</strong> on Cedar Mesa. This isn't a park trail; it's a route. We parked the Tesla at the trailhead, loaded two days of water into our packs, and dropped over the rim.</p>
        <p>Down there, the world changes. It's raw canyon hiking—scrambling over dry pour-offs, navigating confusing slickrock benches, and bushwhacking through tamarisk. The silence is profound. It rings in your ears.</p>
        <img src="images/image_0.png" alt="Ancient Puebloan ruins in a large alcove in Sheiks Canyon" style="width: 100%; height: auto; border-radius: 12px;">
        <p class="image-caption">Discovering well-preserved ruins in the silence of Sheiks Canyon.</p>
        <p>The highlight was turning a corner into a massive alcove and finding perfectly preserved Ancestral Puebloan ruins. Standing there, miles from the nearest road, looking at structures built by hand a thousand years ago, was the spiritual center of the trip. We camped on hard sandstone nearby, watching the stars framed by canyon walls, imagining the people who called this place home centuries ago.</p>
        <h3>Part 3: Mars on Earth</h3>
        <p>After dragging our dusty, tired bodies out of Bullet Canyon, we needed a change of scenery. We drove past Hanksville to <strong>Factory Butte and the Bentonite Hills</strong>. It felt like leaving Earth entirely.</p> 
        <p>The landscape looks like Mars—dunes of grey, purple, and vibrant red clay stretching into the distance, dominated by the massive shark-fin-like butte. We set up camp right at the base. As the sun went down, the colors shifted from harsh greys to soft purples. It was one of the most surreal campsites of my life.</p>
        <img src="images/image_5.png" alt="The Tesla parked in the alien landscape of Factory Butte" style="width: 100%; height: auto; border-radius: 12px;">
        <p class="image-caption">Camped on Mars (Factory Butte, Utah).</p>
        <h3>Part 4: The Giants</h3>
        <p>The trip continued south. We hit Bryce Canyon, stood on the rim of the Grand Canyon, and spent time in Zion. Zion is breathtaking, but the crowds are intense. We escaped high up, finding views that put the scale of the place into perspective.</p>
        <p>It was a moment to just pause and appreciate having someone to share this with. 3,000 miles is a long way to drive, but it's easy when you have the right co-pilot.</p>
        <img src="images/image_2.png" alt="Hugging at a high viewpoint in Zion National Park" style="width: 100%; height: auto; border-radius: 12px;">
        <p>Finally, it was time to turn north. After ten days in the red desert, our eyes needed green. We swung wide into California to visit <strong>Sequoia National Park</strong>.</p>
        <p>Seeing trees wide enough to drive a car through was the perfect palette cleanser before the long haul back to the PNW. Pictures don't do them justice; you have to stand next to one to understand. They feel ancient, like silent watchers of the forest. It was the perfect end to a trip defined by big landscapes.</p>
        <img src="images/image_6.png" alt="Standing at the base of a massive Sequoia tree" style="width: 100%; height: auto; border-radius: 12px;">
        <h3>Trip Stats</h3>
        <ul>
            <li><strong>Total Distance:</strong> ~3,200 miles</li>
            <li><strong>Duration:</strong> 12 Days</li>
            <li><strong>Camping Cost:</strong> $0 (100% dispersed)</li>
            <li><strong>Parks/Areas:</strong> Canyonlands, Arches, Bears Ears, Factory Butte, Bryce, Zion, Grand Canyon, Sequoia.</li>
            <li><strong>Range Anxiety:</strong> Zero. Superchargers were everywhere we needed them, even near the remote spots.</li>
        </ul>
      `
    }
  ];

  // ─────────────────────────────────────────────
  // APP STATE
  // ─────────────────────────────────────────────
  const app = document.getElementById('app');
  let currentFilter = 'all';

  // ─────────────────────────────────────────────
  // CUSTOM CURSOR
  // ─────────────────────────────────────────────
  const cursor = document.getElementById('cursor');
  const cursorRing = document.getElementById('cursorRing');
  let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;

  document.addEventListener('mousemove', e => {
    mouseX = e.clientX; mouseY = e.clientY;
    cursor.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
  });

  function animateCursor() {
    ringX += (mouseX - ringX) * 0.12;
    ringY += (mouseY - ringY) * 0.12;
    cursorRing.style.transform = `translate(${ringX}px, ${ringY}px)`;
    requestAnimationFrame(animateCursor);
  }
  animateCursor();

  document.addEventListener('mouseover', e => {
    const t = e.target.closest('a, .article-card, button, .back-btn, .post-end-btn, [data-magnetic]');
    if (t) { cursor.classList.add('hovering'); cursorRing.classList.add('hovering'); }
  });
  document.addEventListener('mouseout', e => {
    const t = e.target.closest('a, .article-card, button, .back-btn, .post-end-btn, [data-magnetic]');
    if (t) { cursor.classList.remove('hovering'); cursorRing.classList.remove('hovering'); }
  });

  // ─────────────────────────────────────────────
  // SCROLL PROGRESS
  // ─────────────────────────────────────────────
  const scrollBar = document.getElementById('scrollBar');
  window.addEventListener('scroll', () => {
    const scrollTop = document.documentElement.scrollTop;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    if (docHeight > 0) scrollBar.style.transform = `scaleX(${scrollTop / docHeight})`;

    document.getElementById('header').classList.toggle('scrolled', scrollTop > 60);
  });

  // ─────────────────────────────────────────────
  // INTERSECTION OBSERVER for scroll reveals
  // ─────────────────────────────────────────────
  function setupScrollReveals() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 80);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -60px 0px' });

    document.querySelectorAll('.article-card, .book-card, .featured-read, .reveal-img').forEach(el => observer.observe(el));
  }

  // ─────────────────────────────────────────────
  // PAGE TRANSITIONS
  // ─────────────────────────────────────────────
  function navigateTo(target, id) {
    const trans = document.getElementById('pageTransition');
    trans.classList.remove('active');
    void trans.offsetWidth; // reflow
    trans.classList.add('active');

    setTimeout(() => {
      if (target === 'home') renderHome();
      else if (target === 'post') renderPost(id);
      else if (target === 'reads') renderReads();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }, 350);
  }

  // ─────────────────────────────────────────────
  // RENDER HOME
  // ─────────────────────────────────────────────
  function renderHome() {
    const postsToShow = currentFilter === 'all'
      ? blogPosts
      : blogPosts.filter(p => p.category === currentFilter);

    document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
    const activeBtn = document.getElementById(`nav-${currentFilter}`);
    if (activeBtn) activeBtn.classList.add('active');

    const cardsHTML = postsToShow.map((post, i) => `
      <div class="article-card ${i === 0 ? 'featured' : ''}" onclick="navigateTo('post', ${post.id})">
        <div class="card-image">
          <img src="${post.image}" alt="${post.title}" loading="${i < 3 ? 'eager' : 'lazy'}">
        </div>
        <div class="card-body">
          <div class="card-category">${post.category}</div>
          <h2>${post.title}</h2>
          <p class="card-summary">${post.summary}</p>
          <div class="card-meta">
            <span>${post.date}</span>
            <span style="color:var(--accent-dim)">·</span>
            <span>${post.readTime}</span>
          </div>
          <div class="read-indicator">→</div>
        </div>
      </div>
    `).join('');

    app.innerHTML = `
      <section class="hero">
        <div class="hero-badge">Field Notes & First-Hand Accounts</div>
        <h1>The Trail<br>Is the <em>Story</em></h1>
        <p class="hero-sub">Dirt roads, heavy packs, wrong turns, and everything worth remembering along the way.</p>
        <div class="hero-line"></div>
        <div class="hero-scroll-hint">Scroll</div>
      </section>
      <section class="articles-section">
        <div class="section-label">Recent Entries</div>
        <h2 class="section-title">From the Field <span>— ${postsToShow.length} stories</span></h2>
        <div class="articles-grid">${cardsHTML}</div>
      </section>
    `;

    setupScrollReveals();
  }

  // ─────────────────────────────────────────────
  // RENDER CURRENT READS
  // ─────────────────────────────────────────────
  function renderReads() {
    document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
    document.getElementById('nav-reads').classList.add('active');

    const [featuredBook, ...books] = readingList;
    const booksHTML = books.map((book, i) => `
      <article class="book-card">
        <div class="book-number">${String(i + 2).padStart(2, '0')}</div>
        <div>
          <h2 class="book-title">${book.title}</h2>
          <p class="book-author">${book.author}</p>
          ${book.note ? `<p class="book-note">${book.note}</p>` : ''}
        </div>
      </article>
    `).join('');

    app.innerHTML = `
      <div class="reads-view">
        <section class="reads-hero">
          <div class="reads-kicker">Our Bookshelf</div>
          <h1>Current <em>Reads</em></h1>
          <p class="reads-intro">Books we've read, returned to, and recommended to each other—from faith and history to fiction, adventure, and the strange corners in between.</p>
        </section>

        <section class="reads-section">
          <div class="reads-count">${readingList.length} books on our shelf</div>
          <article class="featured-read">
            <div class="book-number">01</div>
            <div>
              <h2 class="book-title">${featuredBook.title}</h2>
              <p class="book-author">${featuredBook.author}</p>
            </div>
            <p class="featured-note">${featuredBook.note}</p>
          </article>
          <div class="reading-grid">${booksHTML}</div>
        </section>
      </div>
    `;

    setupScrollReveals();
  }

  // ─────────────────────────────────────────────
  // RENDER SINGLE POST
  // ─────────────────────────────────────────────
  function renderPost(id) {
    const post = blogPosts.find(p => p.id === id);
    if (!post) return;

    app.innerHTML = `
      <div class="single-post-view">
        <div class="back-btn" onclick="navigateTo('home')">← Back</div>
        
        <div class="post-hero">
          <div class="post-hero-img"><img src="${post.image}" alt="${post.title}"></div>
          <div class="post-hero-overlay"></div>
          <div class="post-hero-content">
            <div class="card-category">${post.category}</div>
            <h1>${post.title}</h1>
            <div class="post-hero-meta">
              <span>${post.date}</span>
              <span class="divider">/</span>
              <span>${post.readTime}</span>
            </div>
          </div>
        </div>

        <div class="post-body-wrap">
          <div class="post-body">${post.content}</div>
        </div>
        
        <div class="post-end">
          <div class="post-end-btn" onclick="navigateTo('home')">← Back to all entries</div>
        </div>
      </div>
    `;
  }

  // ─────────────────────────────────────────────
  // FILTER
  // ─────────────────────────────────────────────
  function filterPosts(category) {
    currentFilter = category;
    navigateTo('home');
  }

  // ─────────────────────────────────────────────
  // INIT
  // ─────────────────────────────────────────────
  renderHome();
</script>
</body>
